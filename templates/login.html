
{% extends "base.html" %}

{% block content %}
<h1>Leader Login</h1>

{% if error %}
<p>Incorrect password. Please try again.</p>
{% endif %}

<form method="POST" action="{{ url_for('login') }}">
    <label for="password">Leader password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >
    <button type="submit">Log In</button>
</form>
{% endblock %}
